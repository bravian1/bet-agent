<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Agent Premium</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <header>
            <a href="index.html" class="logo" style="text-decoration: none;">
                <i class="fa-solid fa-robot"></i> Bet Agent <span class="badge">PRO</span>
            </a>
            <nav style="display: flex; gap: 1.5rem;">
                <a href="index.html" class="nav-link active" style="text-decoration: none; font-weight: 500;"><i
                        class="fa-solid fa-home"></i> Home</a>
                <a href="analytics.html" class="nav-link"
                    style="color: #94a3b8; text-decoration: none; font-weight: 500; display: flex; align-items: center; gap: 0.5rem;"><i
                        class="fa-solid fa-chart-pie"></i> Analytics</a>
            </nav>
        </header>

        <main>
            <div class="hero">
                <h1>AI-Powered Betting Intelligence</h1>
                <p class="subtitle">Join the elite circle. Get daily, data-driven football analysis delivered straight
                    to your inbox.</p>

                <div class="features">
                    <div class="feature-item">
                        <i class="fa-solid fa-brain"></i>
                        <span>Deep Learning Analysis</span>
                    </div>
                    <div class="feature-item">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Performance Tracking</span>
                    </div>
                    <div class="feature-item">
                        <i class="fa-solid fa-envelope-open-text"></i>
                        <span>Daily Insights</span>
                    </div>
                </div>

                <div class="subscription-form">
                    <form id="subscribeForm">
                        <div class="input-group">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="email" placeholder="Enter your email address" required>
                        </div>
                        <button type="submit" id="submitBtn">
                            <span class="btn-text">Subscribe to mail list</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </form>
                    <div id="message" class="message"></div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Bet Agent Pro. All rights reserved.</p>
        </footer>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="background.js"></script>
    <script src="script.js"></script>
</body>

</html>
